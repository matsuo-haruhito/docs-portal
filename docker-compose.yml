services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --locale=C'
    volumes:
      - db:/var/lib/postgresql
    ports:
      - '${PUBLISH_DATABASE_PORT}:5432'
    logging:
      options:
        max-size: 10m
        max-file: '10'

  app:
    build:
      context: ./docker/dev
      args:
        uid: ${APP_UID}
        gid: ${APP_GID}
    env_file: .env
    environment:
      PS1: '\u@\h:\w\$$ '
      TZ: Asia/Tokyo
      HISTFILE: tmp/.bash_history
      RAILS_ENV: development
      SOLID_QUEUE_IN_PUMA: "1"
    working_dir: /app
    tty: true
    stdin_open: true
    volumes:
      - .:/app
      - ./vendor/bundle:/usr/local/bundle
    command: bash -c 'rm -f tmp/pids/server.pid; rails s -b 0.0.0.0'
    ports:
      - '${PUBLISH_WEB_SERVER_PORT}:3000'
    healthcheck:
      test: ["CMD", "ruby", "-e", "require 'net/http'; exit(Net::HTTP.get_response(URI('http://localhost:3000/')).code.to_i < 500 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      - db

  screenshots:
    build:
      context: .
      dockerfile: Dockerfile.screenshots
    command: ["npm", "run", "screenshots"]
    environment:
      APP_HOST: web
      APP_SERVER_PORT: "3000"
      SCREENSHOT_DIR: /workspace/tmp/screenshots
      SCREENSHOT_EMAIL: ${SCREENSHOT_EMAIL:-admin@example.com}
      SCREENSHOT_WIDTH: ${SCREENSHOT_WIDTH:-1440}
      SCREENSHOT_HEIGHT: ${SCREENSHOT_HEIGHT:-1600}
      ROUTES_FILE: /workspace/config/routes.rb
    volumes:
      - .:/workspace
      - /workspace/node_modules
    links:
      - "app:web"
    depends_on:
      app:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  db:
