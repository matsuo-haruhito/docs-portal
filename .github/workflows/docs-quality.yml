name: docs-quality

on:
  push:
    branches: [dev, main]
    paths:
      - README.md
      - Product Profile.md
      - docs/**/*.md
      - .kiro/steering/frontend-interaction-policy.md
      - app/frontend/entrypoints/application.js
      - app/renderers/docusaurus_site_renderer.rb
      - spec/renderers/docusaurus_site_renderer_spec.rb
      - docusaurus/docusaurus.config.ts
      - docusaurus/package.json
      - docusaurus/package-lock.json
      - docusaurus-renderer/**
      - docker-compose.docusaurus.yml
      - docusaurus/plugins/remark-kroki-diagrams.mjs
      - docusaurus/plugins/remark-kroki-diagrams.smoke.test.mjs
      - .env.example
      - docker-compose.kroki.yml
      - .github/workflows/docs-quality.yml
      - .github/scripts/check_markdown_links.rb
      - .github/scripts/check_docs_quality_permissions.rb
      - .github/scripts/check_kroki_runtime_docs.rb
      - .github/scripts/check_formal_review_workflow_boundary.rb
      - .github/scripts/check_todo_queue_boundary.rb
      - .github/scripts/check_docusaurus_table_metadata_boundary.rb
      - .github/scripts/check_search_index_rebuild_history_boundary.rb
      - .github/scripts/check_csv_metadata_json_boundary.rb
      - .github/scripts/check_access_log_boundary.rb
      - .github/scripts/check_api_specification_dry_run_boundary.rb
      - .github/scripts/check_markdown_codeblock_toolbar_boundary.rb
      - .github/scripts/check_storage_usage_csv_boundary.rb
      - .github/scripts/check_maintenance_route_inventory_boundary.rb
      - .github/scripts/check_recurring_job_maintenance_boundary.rb
      - .github/scripts/check_generated_file_retry_maintenance_boundary.rb
      - .github/scripts/check_backup_artifact_release_record_boundary.rb
      - .github/scripts/check_git_import_run_project_filter_boundary.rb
      - .github/scripts/check_import_dry_run_history_boundary.rb
      - .github/scripts/check_restore_rehearsal_record_boundary.rb
      - .github/scripts/check_issue_pr_number_boundary.rb
      - .github/scripts/check_readme_docs_entrance_boundary.rb
      - .github/scripts/check_docs_index_orphan_entries.rb
      - .github/scripts/check_microsoft_graph_preview_boundary.rb
      - .github/scripts/check_closed_active_queue_labels.rb
      - .github/scripts/check_frontend_entrypoint_policy.rb
      - .github/scripts/check_delivery_failure_handoff_boundary.rb
      - .github/scripts/check_sharepoint_webhook_boundary.rb
      - .github/scripts/check_demo_credential_boundary.rb
      - .github/scripts/check_document_usage_csv_metadata_boundary.rb
      - .github/scripts/check_external_preview_access_log_boundary.rb
      - .github/scripts/check_formal_review_current_proposal_boundary.rb
      - .github/scripts/check_app_config_diagnostic_boundary.rb
      - .github/scripts/check_bulk_edit_dry_run_boundary.rb
      - .github/scripts/check_consent_history_boundary.rb
      - .github/scripts/check_dashboard_diagnostic_filter_boundary.rb
      - .github/scripts/check_audit_log_csv_scope_boundary.rb
      - .github/scripts/check_document_usage_page_scope_boundary.rb
      - .github/scripts/check_visual_evidence_comment_boundary.rb
      - .github/scripts/check_role_entry_drift_boundary.rb
      - .markdownlint-cli2.yaml
  pull_request:
    paths:
      - README.md
      - Product Profile.md
      - docs/**/*.md
      - .kiro/steering/frontend-interaction-policy.md
      - app/frontend/entrypoints/application.js
      - app/renderers/docusaurus_site_renderer.rb
      - spec/renderers/docusaurus_site_renderer_spec.rb
      - docusaurus/docusaurus.config.ts
      - docusaurus/package.json
      - docusaurus/package-lock.json
      - docusaurus-renderer/**
      - docker-compose.docusaurus.yml
      - docusaurus/plugins/remark-kroki-diagrams.mjs
      - docusaurus/plugins/remark-kroki-diagrams.smoke.test.mjs
      - .env.example
      - docker-compose.kroki.yml
      - .github/workflows/docs-quality.yml
      - .github/scripts/check_markdown_links.rb
      - .github/scripts/check_docs_quality_permissions.rb
      - .github/scripts/check_kroki_runtime_docs.rb
      - .github/scripts/check_formal_review_workflow_boundary.rb
      - .github/scripts/check_todo_queue_boundary.rb
      - .github/scripts/check_docusaurus_table_metadata_boundary.rb
      - .github/scripts/check_search_index_rebuild_history_boundary.rb
      - .github/scripts/check_csv_metadata_json_boundary.rb
      - .github/scripts/check_access_log_boundary.rb
      - .github/scripts/check_api_specification_dry_run_boundary.rb
      - .github/scripts/check_markdown_codeblock_toolbar_boundary.rb
      - .github/scripts/check_storage_usage_csv_boundary.rb
      - .github/scripts/check_maintenance_route_inventory_boundary.rb
      - .github/scripts/check_recurring_job_maintenance_boundary.rb
      - .github/scripts/check_generated_file_retry_maintenance_boundary.rb
      - .github/scripts/check_backup_artifact_release_record_boundary.rb
      - .github/scripts/check_git_import_run_project_filter_boundary.rb
      - .github/scripts/check_import_dry_run_history_boundary.rb
      - .github/scripts/check_restore_rehearsal_record_boundary.rb
      - .github/scripts/check_issue_pr_number_boundary.rb
      - .github/scripts/check_readme_docs_entrance_boundary.rb
      - .github/scripts/check_docs_index_orphan_entries.rb
      - .github/scripts/check_microsoft_graph_preview_boundary.rb
      - .github/scripts/check_closed_active_queue_labels.rb
      - .github/scripts/check_frontend_entrypoint_policy.rb
      - .github/scripts/check_delivery_failure_handoff_boundary.rb
      - .github/scripts/check_sharepoint_webhook_boundary.rb
      - .github/scripts/check_demo_credential_boundary.rb
      - .github/scripts/check_document_usage_csv_metadata_boundary.rb
      - .github/scripts/check_external_preview_access_log_boundary.rb
      - .github/scripts/check_formal_review_current_proposal_boundary.rb
      - .github/scripts/check_app_config_diagnostic_boundary.rb
      - .github/scripts/check_bulk_edit_dry_run_boundary.rb
      - .github/scripts/check_consent_history_boundary.rb
      - .github/scripts/check_dashboard_diagnostic_filter_boundary.rb
      - .github/scripts/check_audit_log_csv_scope_boundary.rb
      - .github/scripts/check_document_usage_page_scope_boundary.rb
      - .github/scripts/check_visual_evidence_comment_boundary.rb
      - .github/scripts/check_role_entry_drift_boundary.rb
      - .markdownlint-cli2.yaml

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version

      - name: Check docs-quality workflow permissions
        run: ruby .github/scripts/check_docs_quality_permissions.rb

      - name: Check Kroki optional runtime docs
        run: ruby .github/scripts/check_kroki_runtime_docs.rb

      - name: Check formal review workflow boundary docs
        run: ruby .github/scripts/check_formal_review_workflow_boundary.rb

      - name: Check ToDo queue boundary docs
        run: ruby .github/scripts/check_todo_queue_boundary.rb

      - name: Check Docusaurus table metadata boundary docs
        run: ruby .github/scripts/check_docusaurus_table_metadata_boundary.rb

      - name: Check search index rebuild history boundary docs
        run: ruby .github/scripts/check_search_index_rebuild_history_boundary.rb

      - name: Check CSV metadata JSON boundary docs
        run: ruby .github/scripts/check_csv_metadata_json_boundary.rb

      - name: Check AccessLog boundary docs
        run: ruby .github/scripts/check_access_log_boundary.rb

      - name: Check API specification dry-run boundary docs
        run: ruby .github/scripts/check_api_specification_dry_run_boundary.rb

      - name: Check Markdown codeblock toolbar boundary docs
        run: ruby .github/scripts/check_markdown_codeblock_toolbar_boundary.rb

      - name: Check storage usage CSV boundary docs
        run: ruby .github/scripts/check_storage_usage_csv_boundary.rb

      - name: Check maintenance route inventory boundary docs
        run: ruby .github/scripts/check_maintenance_route_inventory_boundary.rb

      - name: Check recurring job maintenance boundary docs
        run: ruby .github/scripts/check_recurring_job_maintenance_boundary.rb

      - name: Check generated file retry maintenance boundary docs
        run: ruby .github/scripts/check_generated_file_retry_maintenance_boundary.rb

      - name: Check backup artifact release record boundary docs
        run: ruby .github/scripts/check_backup_artifact_release_record_boundary.rb

      - name: Check Git import run project filter boundary docs
        run: ruby .github/scripts/check_git_import_run_project_filter_boundary.rb

      - name: Check import dry-run history boundary docs
        run: ruby .github/scripts/check_import_dry_run_history_boundary.rb

      - name: Check restore rehearsal record boundary docs
        run: ruby .github/scripts/check_restore_rehearsal_record_boundary.rb

      - name: Check Issue / PR number boundary docs
        run: ruby .github/scripts/check_issue_pr_number_boundary.rb

      - name: Check README/docs entrance boundary docs
        run: ruby .github/scripts/check_readme_docs_entrance_boundary.rb

      - name: Check docs index orphan entries
        run: ruby .github/scripts/check_docs_index_orphan_entries.rb --self-test && ruby .github/scripts/check_docs_index_orphan_entries.rb

      - name: Check Microsoft Graph preview boundary docs
        run: ruby .github/scripts/check_microsoft_graph_preview_boundary.rb

      - name: Check closed active queue label digest
        run: ruby .github/scripts/check_closed_active_queue_labels.rb --self-test

      - name: Check frontend entrypoint policy
        run: ruby .github/scripts/check_frontend_entrypoint_policy.rb

      - name: Check delivery failure handoff boundary
        run: ruby .github/scripts/check_delivery_failure_handoff_boundary.rb

      - name: Check SharePoint webhook boundary
        run: ruby .github/scripts/check_sharepoint_webhook_boundary.rb

      - name: Check demo credential boundary
        run: ruby .github/scripts/check_demo_credential_boundary.rb

      - name: Check document usage CSV metadata boundary
        run: ruby .github/scripts/check_document_usage_csv_metadata_boundary.rb

      - name: Check external preview AccessLog boundary
        run: ruby .github/scripts/check_external_preview_access_log_boundary.rb

      - name: Check formal review current/proposal boundary
        run: ruby .github/scripts/check_formal_review_current_proposal_boundary.rb

      - name: Check ApplicationConfigurationDiagnostic boundary
        run: ruby .github/scripts/check_app_config_diagnostic_boundary.rb

      - name: Check bulk edit dry-run boundary
        run: ruby .github/scripts/check_bulk_edit_dry_run_boundary.rb

      - name: Check consent history boundary
        run: ruby .github/scripts/check_consent_history_boundary.rb

      - name: Check dashboard diagnostic filter boundary
        run: ruby .github/scripts/check_dashboard_diagnostic_filter_boundary.rb

      - name: Check audit log CSV scope boundary
        run: ruby .github/scripts/check_audit_log_csv_scope_boundary.rb

      - name: Check document usage page scope boundary
        run: ruby .github/scripts/check_document_usage_page_scope_boundary.rb

      - name: Check visual evidence comment boundary
        run: ruby .github/scripts/check_visual_evidence_comment_boundary.rb

      - name: Check role entry drift boundary
        run: ruby .github/scripts/check_role_entry_drift_boundary.rb

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            README.md
            Product Profile.md
            docs/**/*.md

      - name: Check relative markdown links
        run: ruby .github/scripts/check_markdown_links.rb

      - name: Run Docusaurus renderer preflight tests
        working-directory: ./docusaurus-renderer
        run: npm test

      - name: Run Kroki diagram mock smoke
        working-directory: ./docusaurus
        run: npm run smoke:kroki
